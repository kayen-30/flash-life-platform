server:
  port: 8085
spring:
  application:
    name: hm-ai-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    url: ${MYSQL_AI_URL:${MYSQL_URL:jdbc:mysql://127.0.0.1:13306/dian-ping?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 2000
      data-source-properties:
        connectTimeout: 2000
        socketTimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 2s
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      discovery.enabled: ${NACOS_ENABLED:true}
      config.enabled: ${NACOS_ENABLED:true}
    openfeign:
      client.config.default:
        connect-timeout: 1000
        read-timeout: 3000
langchain4j:
  openai:
    # 兼容已有 DeepSeek 配置；需要启用模型时设置 LANGCHAIN4J_ENABLED=true。
    enabled: ${LANGCHAIN4J_ENABLED:${SPRING_AI_CHAT_CLIENT_ENABLED:false}}
    api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: ${OPENAI_BASE_URL:${DEEPSEEK_BASE_URL:https://api.openai.com/v1}}
    model-name: ${OPENAI_MODEL:${DEEPSEEK_MODEL:gpt-4}}
    embedding-enabled: ${LANGCHAIN4J_EMBEDDING_ENABLED:${HMDP_AI_RAG_VECTOR_ENABLED:false}}
    embedding-api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY:${DEEPSEEK_API_KEY:}}}
    embedding-base-url: ${OPENAI_EMBEDDING_BASE_URL:${OPENAI_BASE_URL:${DEEPSEEK_BASE_URL:https://api.openai.com/v1}}}
    embedding-model-name: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    temperature: ${HMDP_AI_TEMPERATURE:0.3}
    max-tokens: ${HMDP_AI_MAX_TOKENS:512}
    # 留空沿用供应商默认值；当前DeepSeek客服在本地配置中显式关闭思考。
    enable-thinking: ${HMDP_AI_ENABLE_THINKING:}
    # 仅对已验证会丢失前序消息的兼容接口显式开启；不改变JSON、权限或证据校验。
    single-message-compat: ${HMDP_AI_SINGLE_MESSAGE_COMPAT:false}
    timeout: ${HMDP_AI_HTTP_READ_TIMEOUT:10s}
    max-retries: ${HMDP_AI_RETRY_MAX_ATTEMPTS:0}
  cohere:
    # 按需开启中文精排；未配置时由 RerankService 保留向量召回顺序。
    enabled: ${COHERE_RERANK_ENABLED:false}
    api-key: ${COHERE_API_KEY:}
    base-url: ${COHERE_RERANK_BASE_URL:https://api.cohere.ai}
    model-name: ${COHERE_RERANK_MODEL:rerank-multilingual-v3.0}
    timeout: ${COHERE_RERANK_TIMEOUT:2s}
    max-retries: ${COHERE_RERANK_MAX_RETRIES:1}
milvus:
  enabled: ${MILVUS_ENABLED:true}
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  database: ${MILVUS_DATABASE:default}
  embedding-dimension: ${MILVUS_EMBEDDING_DIMENSION:1536}
  knowledge-collection: ${MILVUS_KNOWLEDGE_COLLECTION:shop_knowledge}
  conversation-collection: ${MILVUS_CONVERSATION_COLLECTION:conversation_memory}
  auto-import: ${MILVUS_AUTO_IMPORT:true}
  auto-flush-on-insert: ${MILVUS_AUTO_FLUSH_ON_INSERT:true}
hmdp:
  internal-token: ${HMDP_INTERNAL_TOKEN}
  ai:
    skills:
      # MVP 显式启用；关闭后保留原 Agent/RAG/工具行为。
      enabled: ${HMDP_AI_SKILLS_ENABLED:false}
      # native按需激活；inline仅用于同正文常驻提示的对照实验。
      mode: ${HMDP_AI_SKILLS_MODE:native}
    execution:
      max-concurrent-requests: ${HMDP_AI_MAX_CONCURRENT_REQUESTS:8}
      acquire-timeout: ${HMDP_AI_ACQUIRE_TIMEOUT:100ms}
      circuit-failure-threshold: ${HMDP_AI_CIRCUIT_FAILURE_THRESHOLD:5}
      circuit-open-duration: ${HMDP_AI_CIRCUIT_OPEN_DURATION:30s}
      max-tool-calls: ${HMDP_AI_MAX_TOOL_CALLS:4}
      # 每次模型调用均计完整输入，使用供应商 usage 校正；并非账单硬上限。
      token-budget-per-request: ${HMDP_AI_TOKEN_BUDGET_PER_REQUEST:12288}
      max-model-calls: ${HMDP_AI_MAX_MODEL_CALLS:4}
      request-timeout: ${HMDP_AI_REQUEST_TIMEOUT:25s}
      http-connect-timeout: ${HMDP_AI_HTTP_CONNECT_TIMEOUT:2s}
      http-read-timeout: ${HMDP_AI_HTTP_READ_TIMEOUT:10s}
    planning:
      enabled: ${HMDP_AI_PLANNING_ENABLED:false}
    rate-limit:
      chat-per-minute: ${HMDP_AI_CHAT_RATE_LIMIT:10}
      recommend-per-minute: ${HMDP_AI_RECOMMEND_RATE_LIMIT:10}
    recommend-cache-ttl: ${HMDP_AI_RECOMMEND_CACHE_TTL:6h}
    rag:
      knowledge:
        # 在线实例统一读取数据库发布；classpath/file只用于显式离线验证。
        resource: ${HMDP_AI_KNOWLEDGE_RESOURCE:shared}
        namespace: ${HMDP_AI_KNOWLEDGE_NAMESPACE:customer-service}
        publish-token: ${HMDP_AI_KNOWLEDGE_PUBLISH_TOKEN:}
        sync-interval-ms: ${HMDP_AI_KNOWLEDGE_SYNC_INTERVAL_MS:15000}
      vector:
        # 只有明确配置 EmbeddingModel 与 Milvus 时才开启向量召回；默认使用关键词兜底。
        enabled: ${HMDP_AI_RAG_VECTOR_ENABLED:false}
        index-name: ${HMDP_AI_RAG_VECTOR_INDEX:idx:ai:knowledge}
        key-prefix: ${HMDP_AI_RAG_VECTOR_KEY_PREFIX:ai:knowledge:}
        # 先扩大候选集，再由 Rerank 截取最终上下文。
        candidate-top-k: ${HMDP_AI_RAG_VECTOR_CANDIDATE_TOP_K:10}
        top-k: ${HMDP_AI_RAG_VECTOR_TOP_K:3}
        min-score: ${HMDP_AI_RAG_VECTOR_MIN_SCORE:0.5}
      memory:
        short-term-rounds: ${HMDP_AI_RAG_MEMORY_SHORT_TERM_ROUNDS:3}
        long-term-candidate-top-k: ${HMDP_AI_RAG_MEMORY_CANDIDATE_TOP_K:5}
        long-term-top-k: ${HMDP_AI_RAG_MEMORY_TOP_K:2}
        min-score: ${HMDP_AI_RAG_MEMORY_MIN_SCORE:0.5}

management:
  server:
    port: ${MANAGEMENT_PORT:18085}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
