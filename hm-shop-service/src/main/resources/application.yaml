server:
  port: 8082
spring:
  application:
    name: hm-shop-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    url: ${MYSQL_SHOP_URL:${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/dian-ping?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}
    connection-timeout: 3s
    socket-timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hmdp}
    password: ${RABBITMQ_PASSWORD:hmdp-rabbit}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/add_shop_description.sql
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      discovery.enabled: ${NACOS_ENABLED:true}
      config.enabled: ${NACOS_ENABLED:true}
mybatis-plus:
  type-aliases-package: com.hmdp.entity
hmdp:
  internal-token: ${HMDP_INTERNAL_TOKEN}
  elasticsearch:
    initialize-on-startup: ${HMDP_ELASTICSEARCH_INITIALIZE_ON_STARTUP:false}
