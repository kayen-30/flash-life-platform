name: hm-dianping

x-java-environment: &java-environment
  MYSQL_URL: jdbc:mysql://mysql:3306/dian-ping?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  NACOS_ADDR: nacos:8848
  NACOS_ENABLED: "true"
  SENTINEL_DASHBOARD: sentinel-dashboard:8858
  HMDP_INTERNAL_TOKEN: ${HMDP_INTERNAL_TOKEN:?Run start.ps1 to initialize .env}
  NACOS_USERNAME: ${NACOS_USERNAME:?Run start.ps1 to initialize .env}
  NACOS_PASSWORD: ${NACOS_PASSWORD:?Run start.ps1 to initialize .env}
  HMDP_ADMIN_USER_IDS: ${HMDP_ADMIN_USER_IDS:-1}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-hmdp}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-hmdp-rabbit}
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai

x-java-service: &java-service
  restart: unless-stopped
  environment:
    <<: *java-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    nacos:
      condition: service_healthy

services:
  mysql:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    container_name: hmdp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: dian-ping
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
      - ./deploy/mysql/add_blog_like_table.sql:/docker-entrypoint-initdb.d/02-blog-like.sql:ro
      - ./deploy/mysql/add_voucher_order_unique_index.sql:/docker-entrypoint-initdb.d/03-voucher-order-index.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:8.0-alpine}
    container_name: hmdp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-stack:
    image: ${REDIS_STACK_IMAGE:-docker.m.daocloud.io/redis/redis-stack-server:latest}
    container_name: hmdp-redis-stack
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-stack-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: hm-dianping/rabbitmq-delayed:local
    build:
      context: ./deploy/rabbitmq
    container_name: hmdp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-hmdp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hmdp-rabbit}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  elasticsearch:
    image: hm-dianping/elasticsearch-ik:${ELASTICSEARCH_VERSION:-8.18.1}
    build:
      context: ./deploy/elasticsearch
      args:
        ELASTICSEARCH_VERSION: ${ELASTICSEARCH_VERSION:-8.18.1}
        ELASTICSEARCH_IMAGE: ${ELASTICSEARCH_IMAGE:-m.daocloud.io/docker.elastic.co/elasticsearch/elasticsearch}
    container_name: hmdp-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  nacos:
    image: ${NACOS_IMAGE:-docker.m.daocloud.io/nacos/nacos-server:v3.0.3}
    container_name: hmdp-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Run start.ps1 to initialize .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Run start.ps1 to initialize .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Run start.ps1 to initialize .env}
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
      - "127.0.0.1:18048:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  sentinel-dashboard:
    image: ${SENTINEL_IMAGE:-docker.1ms.run/bladex/sentinel-dashboard:1.8.8}
    container_name: hmdp-sentinel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8858:8858"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8858/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  user-service:
    <<: *java-service
    image: hm-dianping/user-service:local
    build:
      context: .
      args:
        MODULE: hm-user-service

  shop-service:
    <<: *java-service
    image: hm-dianping/shop-service:local
    build:
      context: .
      args:
        MODULE: hm-shop-service
    environment:
      <<: *java-environment
      HMDP_ELASTICSEARCH_INITIALIZE_ON_STARTUP: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  content-service:
    <<: *java-service
    image: hm-dianping/content-service:local
    build:
      context: .
      args:
        MODULE: hm-content-service
    environment:
      <<: *java-environment
      HMDP_UPLOAD_DIR: /data/uploads
    volumes:
      - ${HMDP_FRONTEND_DIR:-./frontend}/imgs:/data/uploads

  trade-service:
    <<: *java-service
    image: hm-dianping/trade-service:local
    build:
      context: .
      args:
        MODULE: hm-trade-service
    ports:
      - "127.0.0.1:18083:18083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    <<: *java-service
    image: hm-dianping/ai-service:local
    build:
      context: .
      args:
        MODULE: hm-ai-service
    environment:
      <<: *java-environment
      HMDP_AI_RAG_REDIS_HOST: redis-stack
      HMDP_AI_RAG_REDIS_PORT: 6379
      SPRING_AI_CHAT_CLIENT_ENABLED: ${SPRING_AI_CHAT_CLIENT_ENABLED:-false}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
      nacos:
        condition: service_healthy

  gateway:
    <<: *java-service
    image: hm-dianping/gateway:local
    build:
      context: .
      args:
        MODULE: hm-gateway
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      user-service:
        condition: service_started
      shop-service:
        condition: service_started
      content-service:
        condition: service_started
      trade-service:
        condition: service_started
      ai-service:
        condition: service_started
    ports:
      - "127.0.0.1:10010:10010"
      - "127.0.0.1:19010:19010"

  frontend:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:alpine}
    container_name: hmdp-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - ${HMDP_FRONTEND_DIR:-./frontend}:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  redis-stack-data:
  rabbitmq-data:
  elasticsearch-data:
  nacos-data:
  nacos-logs:
