server:
  port: 8084
spring:
  application:
    name: hm-content-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    url: ${MYSQL_CONTENT_URL:${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/dian-ping?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      discovery.enabled: ${NACOS_ENABLED:true}
      config.enabled: ${NACOS_ENABLED:true}
    openfeign:
      client.config.default:
        connect-timeout: 1000
        read-timeout: 2000
mybatis-plus:
  type-aliases-package: com.hmdp.entity
hmdp:
  internal-token: ${HMDP_INTERNAL_TOKEN}
  upload-dir: ${HMDP_UPLOAD_DIR:./data/uploads}
