server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Keep the repository-era /frontend/*.html links working after the SPA move.
    location ^~ /frontend/ {
        rewrite ^/frontend/(.*)$ /$1 last;
    }

    location = /shop-detail.html { return 302 /index.html#/shop?id=$arg_id; }
    location = /blog-detail.html { return 302 /index.html#/note?id=$arg_id; }
    location = /shop-list.html { return 302 /index.html#/nearby; }
    location = /blog-edit.html { return 302 /index.html#/publish; }
    location = /info.html { return 302 /index.html#/profile; }
    location = /info-edit.html { return 302 /index.html#/profile; }
    location = /other-info.html { return 302 /index.html#/profile; }
    location = /login.html { return 302 /index.html#/login; }
    location = /login2.html { return 302 /index.html#/login; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolve the Docker service name periodically so gateway restarts do not leave a stale IP.
        set $gateway_upstream http://gateway:10010;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
